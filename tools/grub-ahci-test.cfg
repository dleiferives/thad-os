set timeout=0
set default=0
serial --unit=0 --speed=115200
insmod all_video
insmod gfxterm
set gfxmode=1280x800x32,1024x768x32,auto
set gfxpayload=keep
terminal_output gfxterm serial

menuentry "thad-os AHCI test" {
    multiboot2 /boot/kernel thad-test-elf thad-keep-bootstrap-map thad-log0=260096:2 thad-log1=260098:30 thad-log2=260128:32 thad-log3=260160:64
    boot
}
