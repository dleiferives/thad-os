set timeout=0
set default=0
serial --unit=0 --speed=115200
insmod all_video
insmod gfxterm
set gfxmode=1280x800x32,1024x768x32,auto
set gfxpayload=keep
terminal_output gfxterm serial

menuentry "thad-os QEMU test" {
    multiboot2 /boot/kernel thad-test-elf
    module2 /boot/root.img thad-root
    boot
}
